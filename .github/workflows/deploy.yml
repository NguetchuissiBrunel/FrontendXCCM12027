name: Frontend CI/CD

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/xccm-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://xccm1.duckdns.org

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: lower
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$OWNER_LOWER/xccm-frontend" >> $GITHUB_OUTPUT

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.lower.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e

            OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_FULL="ghcr.io/$OWNER_LOWER/xccm-frontend:latest"
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_DIR="${DEPLOY_DIR:-$HOME/xccm/FrontendXCCM12027}"

            echo ">>> Deploying image: $IMAGE_FULL"
            echo ">>> Directory: $DEPLOY_DIR"

            # Ensure deploy directory exists
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "ERROR: Deploy directory not found: $DEPLOY_DIR"
              exit 1
            fi

            cd "$DEPLOY_DIR"

            # Authenticate to GHCR
            echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Ensure the external Docker network exists
            docker network inspect xccm-network >/dev/null 2>&1 || \
              docker network create xccm-network

            # Pull the new image
            DOCKER_IMAGE="$IMAGE_FULL" \
            VPS_IP="${{ secrets.VPS_IP }}" \
              docker compose -f docker-compose.prod.yml pull

            # Restart services with zero-downtime
            DOCKER_IMAGE="$IMAGE_FULL" \
            VPS_IP="${{ secrets.VPS_IP }}" \
              docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Clean up old images
            docker image prune -f

            echo ">>> Deploy complete."
